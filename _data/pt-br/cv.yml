- title: Projetos e Pesquisa
  type: time_table
  contents:
  - title: Project Aporia — Plataforma Analítica e Amostral de Pesquisa de Opinião
    institution: Ágora Pesquisa / NKIN Consultoria
    year: 2025 - 2026
    description:
    - Plataforma analítica e arquitetura de dados desenvolvida para automatizar o
      planejamento amostral e a ingestão de questionários de opinião pública e pesquisas
      de mercado. Transforma setores censitários em células espaciais H3 e gera painéis
      analíticos dinâmicos de suporte à decisão executiva.
    - <b>Stack:</b> FastAPI, Python, React 18, TypeScript, Leaflet, GeoParquet, Uber
      H3, SQLAlchemy, PostgreSQL, Docker
    - <em>[Ficha Pública Sanitizada]</em>
  - title: Pair Trading com Machine Learning na B3 (Monografia USP/ESALQ)
    institution: USP / ESALQ
    year: 2024 - 2026
    description:
    - Monografia de conclusão do MBA em Data Science e Analytics na USP/ESALQ. Desenvolveu
      um estudo comparativo empírico rigoroso entre o arcabouço clássico econométrico
      de cointegração de Engle-Granger e algoritmos supervisionados de Machine Learning
      aplicados à geração de sinais de arbitragem estatística em ações da B3.
    - <b>Stack:</b> Python, Statsmodels, Scikit-Learn, Pandas, NumPy, Matplotlib
  - title: Otimização Combinatória sob Restrições de Cardinalidade e Fricções na B3
    institution: UFF / MESC
    year: 2026 - Presente
    description:
    - Pesquisa de mestrado profissional stricto sensu formulando modelos exatos de
      Programação Quadrática Inteira Mista (MIQP) e Programação Linear Inteira Mista
      (MILP) com minimização de Conditional Value-at-Risk (CVaR) linearizado. O modelo
      busca a alocação dinâmica de portfólios ótimos de arbitragem estatística na
      B3, incorporando custos de transação, slippage, taxas de aluguel e restrições
      de cardinalidade.
    - <b>Stack:</b> Python, Gurobi, Pyomo, SciPy, R, LaTeX
  - title: Pipeline Automatizado de Engenharia de Dados via Meta API (WhatsApp)
    institution: Ágora Pesquisa
    year: 2025 - 2026
    description:
    - Pipeline automatizado de coleta, validação e tabulação de dados conversacionais
      via WhatsApp Business API para apuração contínua e em tempo real de métricas
      de Customer Experience (NPS/CSAT), reduzindo em 90% a necessidade de intervenção
      humana.
    - <b>Stack:</b> Python, Meta Graph API, Webhooks, FastAPI, SQL, PostgreSQL, Power
      BI
    - <em>[Ficha Pública Sanitizada]</em>
  - title: Toolkit Unificado de Transcrição, OCR e NLP para Pesquisas de Campo
    institution: Ágora Pesquisa / AGP
    year: 2025 - 2026
    description:
    - Toolkit modular em linha de comando (CLI) desenvolvido para otimizar o ciclo
      de pesquisas qualitativas e quantitativas de campo. Executa conversão e compressão
      de mídia, transcrição de áudio com diarização de interlocutores (Whisper, Gemini,
      Google STT), OCR de formulários e análise semântica estruturada.
    - <b>Stack:</b> Python, OpenAI Whisper, Google STT, Gemini API, PaddleOCR, Mistral,
