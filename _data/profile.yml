summary:
  pt: >-
    Economista formado pela Universidade Federal do Rio de Janeiro (UFRJ) e Assessor de Investimentos credenciado pela ANCORD sob a Resolução CVM 178, atuando como sócio na Meta Investimentos com foco em alocação estratégica de ativos, modelagem quantitativa de risco e governança regulatória. Conduz atendimento institucional de abrangência nacional com presença regional na Região dos Lagos/RJ (Araruama e Rio das Ostras). É pós-graduado com MBA em Data Science e Analytics pela USP/ESALQ e aluno regular do Mestrado Profissional em Engenharia de Produção e Sistemas Computacionais da Universidade Federal Fluminense (UFF/MESC), desenvolvendo pesquisa em Pesquisa Operacional e Otimização Combinatória aplicada à arbitragem estatística e seleção de carteiras na B3. Possui atuação prévia em inteligência analítica e engenharia de dados, liderando tecnicamente a plataforma analítica FieldCopilot.
  en: >-
    Economist graduated from the Federal University of Rio de Janeiro (UFRJ) and accredited Wealth & Investment Advisor certified by ANCORD under CVM Resolution 178, serving as partner at Meta Investimentos with a focus on asset allocation, quantitative risk modeling, and regulatory compliance. Delivers institutional wealth advisory with nationwide reach and regional presence in Região dos Lagos/RJ (Araruama and Rio das Ostras). Holds an MBA in Data Science and Analytics from USP/ESALQ and is an active graduate student in the Professional Master's Program in Production Engineering and Computational Systems at Fluminense Federal University (UFF/MESC), researching combinatorial optimization and operations research applied to statistical arbitrage and portfolio selection on B3. Possesses prior background in business analytics and data engineering, having led technical development of the analytical platform FieldCopilot.
